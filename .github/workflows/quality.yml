name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      E2E_BROWSER_PATH: /usr/bin/google-chrome
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: JavaScript and JSDoc contracts
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Component tests
        run: npm run test:component

      - name: Match Center data integrity
        run: npm run data:verify

      - name: Production build
        run: npm run build

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Accessibility smoke tests
        run: npm run test:a11y

      - name: Broken internal links
        run: npm run links:check

      - name: Sitemap and technical SEO
        run: npm run seo:verify
