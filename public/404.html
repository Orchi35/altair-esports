<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#04101d">
    <title>Sayfa Bulunamadı · ALTAIR eSports</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #020812;
        color: #edf7fb;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 28%, rgba(34, 211, 238, .12), transparent 28%),
          linear-gradient(145deg, #07192b, #020812 64%);
      }
      main {
        width: min(100%, 720px);
        padding: clamp(34px, 7vw, 72px);
        border: 1px solid rgba(126, 211, 255, .18);
        background: rgba(4, 14, 25, .88);
        box-shadow: 0 32px 80px rgba(0, 0, 0, .38);
        text-align: center;
      }
      img {
        width: 112px;
        height: 112px;
        object-fit: contain;
        filter: drop-shadow(0 12px 28px rgba(34, 211, 238, .2));
      }
      strong {
        display: block;
        margin-top: 24px;
        color: #22d3ee;
        font-size: 12px;
        letter-spacing: .22em;
      }
      h1 {
        margin: 14px 0 0;
        font-size: clamp(38px, 8vw, 72px);
        line-height: .95;
        letter-spacing: -.04em;
        text-transform: uppercase;
      }
      p {
        max-width: 48ch;
        margin: 22px auto 0;
        color: #91a6b2;
        line-height: 1.7;
      }
      a {
        min-height: 48px;
        margin-top: 30px;
        padding: 0 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #22d3ee;
        color: #02101a;
        font-weight: 800;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: .08em;
      }
      a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-ui.png" alt="ALTAIR eSports logosu" width="112" height="112">
      <strong>HATA · 404</strong>
      <h1>Sayfa bulunamadı.</h1>
      <p>Aradığınız sayfa taşınmış veya artık mevcut olmayabilir. ALTAIR eSports ana sayfasına dönerek devam edebilirsiniz.</p>
      <a href="/">Ana sayfaya dön&nbsp; →</a>
    </main>
  </body>
</html>
