<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030711" />
    <title>ALTAIR eSports — Çevrimdışı</title>
    <style>
      :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#030711;color:#eef2f8}
      *{box-sizing:border-box}
      body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 15%,#10253c 0,#07111f 36%,#030711 72%)}
      main{width:min(100%,560px);padding:clamp(28px,7vw,52px);border:1px solid rgba(34,211,238,.25);border-radius:24px;background:rgba(7,13,24,.9);box-shadow:0 28px 80px rgba(0,0,0,.42)}
      img{display:block;width:72px;height:72px;object-fit:contain;margin-bottom:28px}
      p:first-of-type{margin:0 0 10px;color:#67e8f9;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
      h1{margin:0;font-size:clamp(30px,8vw,48px);line-height:1.02}
      p{color:#aeb8cc;line-height:1.65}
      button{min-height:48px;margin-top:12px;padding:0 20px;border:1px solid #67e8f9;border-radius:10px;color:#030711;background:#67e8f9;font:inherit;font-weight:800;cursor:pointer}
      button:focus-visible{outline:3px solid #fff;outline-offset:3px}
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-ui.png" alt="ALTAIR eSports" />
      <p>Bağlantı durumu</p>
      <h1>Şu anda çevrimdışısınız.</h1>
      <p>Güncel maç, fikstür ve puan durumu doğrulanamadığı için eski verileri göstermiyoruz. Bağlantınız geldiğinde yeniden deneyin.</p>
      <button type="button" onclick="window.location.reload()">Yeniden dene</button>
    </main>
  </body>
</html>
